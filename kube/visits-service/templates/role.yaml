{{- if or (eq .Values.profiles "kubernetes") (regexMatch "^(.*,)?kubernetes(,.*)?$" (regexReplaceAll "\\s+" .Values.profiles " ")) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "visits-service.fullname" . }}-role
  labels:
    {{- include "visits-service.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
{{- end }}
