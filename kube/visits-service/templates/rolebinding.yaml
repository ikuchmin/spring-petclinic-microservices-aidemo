{{- if or (eq .Values.spring.profiles.active "kubernetes") (regexMatch "^(.*,)?kubernetes(,.*)?$" (regexReplaceAll "\\s+" .Values.spring.profiles.active " ")) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "visits-service.fullname" . }}-rolebinding
  labels:
    {{- include "visits-service.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "visits-service.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "visits-service.fullname" . }}-role
  apiGroup: rbac.authorization.k8s.io
{{- end }}
