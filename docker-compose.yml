services:
  config-server:
    image: spring-petclinic-config-server:3.4.1
    container_name: config-server
    environment:
      - SPRING_PROFILES_ACTIVE=discovery,git
      - SPRING_CLOUD_CONSUL_HOST=consul
      - ENCRYPT_KEYSTORE_LOCATION=/keystore/keystore.p12
      - ENCRYPT_KEYSTORE_ALIAS=compose
      - ENCRYPT_KEYSTORE_PASSWORD=w6egf6QA4hhjs7DHV_Py
    volumes:
      - ./docker/config-server/keystore:/workspace/keystore
      - ./docker/config-server/tmp:/tmp
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      consul:
        condition: service_healthy
    ports:
     - 8888:8888

  consul:
    image: hashicorp/consul:1.18
    container_name: consul
    command: agent -dev -client=0.0.0.0
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://consul:8500/v1/status/leader"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
     - 8500:8500

  customers-service:
    image: spring-petclinic-customers-service:3.4.1-df
    container_name: customers-service
    environment:
#      - SPRING_PROFILES_ACTIVE=discovery,postgres
      - SPRING_PROFILES_ACTIVE=discovery,cloudconfig,postgres
      - SPRING_PROFILES_ACTIVE=postgres,kubernetes,trace
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_DATASOURCE_URL=jdbc:postgresql://customers-postgresql:5432/petclinic
      - JAVA_DEBUG_OPTS=
      - JAVA_FLIGHT_RECORDING_OPTS=
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      config-server:
        condition: service_started
      consul:
        condition: service_healthy
      customers-postgresql:
        condition: service_healthy
    ports:
#      - 8081:8081
      - "8081:8080"

  customers-postgresql:
    image: postgres:17.6
    restart: "no"
    ports:
      - "5434:5432"
    volumes:
      - customers-postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: petclinic
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  visits-service:
    image: spring-petclinic-visits-service:3.4.1
    container_name: visits-service
    environment:
      - SPRING_PROFILES_ACTIVE=discovery,cloudconfig,postgres
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_DATASOURCE_URL=jdbc:postgresql://visits-postgresql:5432/petclinic
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      config-server:
        condition: service_started
      consul:
        condition: service_healthy
    ports:
     - 8082:8082

  visits-postgresql:
    image: postgres:17.6
    restart: "no"
    ports:
      - "5435:5432"
    volumes:
      - visits-postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: petclinic
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  vets-service:
    image: spring-petclinic-vets-service:3.4.1
    container_name: vets-service
    environment:
      - SPRING_PROFILES_ACTIVE=discovery,cloudconfig,postgres
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_DATASOURCE_URL=jdbc:postgresql://vets-postgresql:5432/petclinic
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      config-server:
        condition: service_started
      consul:
        condition: service_healthy
    ports:
     - 8083:8083

  vets-postgresql:
    image: postgres:17.6
    restart: "no"
    ports:
      - "5436:5432"
    volumes:
      - vets-postgresql_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
      POSTGRES_DB: petclinic
    healthcheck:
      test: pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  genai-service:
    image: spring-petclinic-genai-service:3.4.1
    container_name: genai-service
    environment:
      - SPRING_PROFILES_ACTIVE=discovery,cloudconfig
      - SPRING_CLOUD_CONSUL_HOST=consul
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - AZURE_OPENAI_KEY=${AZURE_OPENAI_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      config-server:
        condition: service_started
      consul:
        condition: service_healthy
    ports:
     - 8084:8084


  api-gateway:
    image: spring-petclinic-api-gateway:3.4.1
    container_name: api-gateway
    environment:
      - SPRING_PROFILES_ACTIVE=discovery,cloudconfig
      - SPRING_CLOUD_CONSUL_HOST=consul
    deploy:
      resources:
        limits:
          memory: 1024M
    depends_on:
      config-server:
        condition: service_started
      consul:
        condition: service_healthy
    ports:
     - 8080:8080

  tracing-server:
    image: openzipkin/zipkin
    container_name: tracing-server
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
     - 9411:9411

  admin-server:
    image: spring-petclinic-admin-server:3.4.1
    container_name: admin-server
    environment:
      - SPRING_PROFILES_ACTIVE=discovery,cloudconfig
      - SPRING_CLOUD_CONSUL_HOST=consul
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      config-server:
        condition: service_started
      consul:
        condition: service_healthy
    ports:
     - 9092:9090

  ## Grafana / Prometheus

  grafana-server:
    build: ./docker/grafana
    container_name: grafana-server
    deploy:
      resources:
        limits:
          memory: 256M
    ports:
    - 3030:3030

  prometheus-server:
    build: ./docker/prometheus
    container_name: prometheus-server
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  vets-postgresql_data:
  customers-postgresql_data:
  visits-postgresql_data:
#    ports:
#    - 9091:9090
