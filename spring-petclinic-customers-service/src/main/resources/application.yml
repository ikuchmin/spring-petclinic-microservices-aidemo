spring:
  application:
    name: customers-service
  config:
    import: "optional:configserver:"
  flyway:
    enabled: true
    locations: classpath:db/migration/common,classpath:db/migration/${database}
  jpa:
    hibernate:
      ddl-auto: validate
  cloud:
    config:
      enabled: false
      fail-fast: true
      discovery:
        enabled: true
        service-id: config-server
    consul:
      enabled: false
      discovery:
        enabled: false
        service-name: ${spring.application.name}
        instance-id: ${spring.application.name}:${random.uuid}

  sql:
    init:
      data-locations: classpath*:db/data/${database}/data.sql
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

---
spring:
  config:
    activate:
      on-profile: consul
  cloud:
    consul:
      enabled: true
      discovery:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: cloudconfig
  cloud:
    config:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5434/petclinic
    username: petclinic
    password: petclinic
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

database: postgresql

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://localhost:3306/petclinic?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: petclinic
    password: petclinic
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

database: mysql
---
spring:
  config:
    activate:
      on-profile: hsql
  datasource:
    url: jdbc:hsqldb:mem:petclinic
    username: sa
    password:
    driver-class-name: org.hsqldb.jdbcDriver
  jpa:
    database-platform: org.hibernate.dialect.HSQLDialect

database: hsqldb
