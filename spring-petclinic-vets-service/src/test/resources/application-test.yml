spring:
  cloud:
    config:
      enabled: false
  sql:
    init:
      schema-locations: classpath*:db/hsqldb/schema.sql
      data-locations: classpath*:db/hsqldb/data.sql
  jpa:
    hibernate:
      ddl-auto: none

# Disable Consul discovery in tests
spring.cloud.consul.enabled: false
spring.cloud.discovery.enabled: false

vets:
  cache:
    ttl: 10
    heap-size: 10
